name: nyc-taxi-weather-demand-forecasting

x-spark-common: &spark-common
  image: nyc-taxi-weather-spark:3.5.7-hadoop3.3.4
  build:
    context: .
    dockerfile: docker/spark/Dockerfile
  environment:
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Copy .env.example to .env and set MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Copy .env.example to .env and set MINIO_ROOT_PASSWORD}
    AWS_REGION: us-east-1
    AWS_DEFAULT_REGION: us-east-1
    PYSPARK_PYTHON: python3
    PYTHONPATH: /opt/project/src
  volumes:
    - ./docker/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    - ./scripts:/opt/project/scripts:ro
    - ./src:/opt/project/src:ro
    - ./tests:/opt/project/tests:ro
    - ./data/silver:/opt/project/output
  networks:
    - data-platform

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Copy .env.example to .env and set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Copy .env.example to .env and set MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/ready"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    networks:
      - data-platform

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/bigdata
        for prefix in \
          bronze/taxi \
          bronze/weather \
          silver/taxi_clean \
          silver/weather_clean \
          silver/demand_weather \
          gold/predictions \
          gold/metrics
        do
          printf 'managed prefix\n' | mc pipe "local/bigdata/$${prefix}/.keep"
          mc stat "local/bigdata/$${prefix}/.keep" >/dev/null
        done
        mc stat local/bigdata >/dev/null
        echo "MINIO_INIT_OK bucket=bigdata prefixes=7"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Copy .env.example to .env and set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Copy .env.example to .env and set MINIO_ROOT_PASSWORD}
    restart: "no"
    networks:
      - data-platform

  spark-master:
    <<: *spark-common
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${SPARK_MASTER_UI_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/json/"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  spark-worker:
    <<: *spark-common
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "2"
      - --memory
      - 2g
      - --webui-port
      - "8081"
      - spark://spark-master:7077
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "${SPARK_WORKER_UI_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  bronze-ingest:
    profiles: ["ingestion"]
    image: nyc-taxi-weather-bronze-ingest:python3.12
    build:
      context: .
      dockerfile: docker/ingestion/Dockerfile
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Copy .env.example to .env and set MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Copy .env.example to .env and set MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ./data/ingestion:/output
    restart: "no"
    networks:
      - data-platform

volumes:
  minio-data:

networks:
  data-platform:
    driver: bridge
